name: Dependency Remediation

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'feat/production-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remediate lockfile vulnerabilities
        run: npm audit fix --package-lock-only --omit=dev

      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo 'Dependency graph already clean; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json package.json
          git commit -m 'security: remediate audited dependency vulnerabilities'
          git push origin HEAD:${{ github.head_ref }}
