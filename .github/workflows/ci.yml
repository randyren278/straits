name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/straits_ci
  JWT_SECRET: ci-only-not-a-production-secret

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:ci

  schema:
    name: Portable schema + migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: straits_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d straits_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply schema and migrations twice
        env:
          PGPASSWORD: postgres
        run: |
          for pass in 1 2; do
            echo "Schema pass $pass"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/schema-portable.sql
            for migration in scripts/migrations/*.sql; do
              echo "Applying $migration"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
            done
          done

      - name: Verify schema security invariants
        env:
          PGPASSWORD: postgres
        run: |
          table_count="$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','p');")"
          unprotected="$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity;")"
          pipeline_table="$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('public.pipeline_runs') IS NOT NULL;")"
          test "$table_count" -ge 11
          test "$unprotected" = "0"
          test "$pipeline_table" = "t"

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, schema]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production bundle
        run: npm run build

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
