<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; }
  #root { position: relative; overflow: hidden; font-family: 'JetBrains Mono', ui-monospace, monospace; background: #000; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Scene 1 — boot */
  #s1 { display: flex; align-items: center; justify-content: center; background: #000; }
  #s1map { opacity: 0; filter: saturate(0.9); }
  #s1vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%); }
  #boot { position: relative; text-align: center; z-index: 3; }
  #brand { font-size: 92px; font-weight: 800; letter-spacing: 8px; color: #fff; white-space: nowrap; }
  #brandcursor { display: inline-block; width: 10px; height: 78px; background: #f59e0b; margin-left: 10px; vertical-align: middle; }
  #liveword { margin-top: 26px; font-size: 40px; font-weight: 700; letter-spacing: 20px; color: #f59e0b; opacity: 0; }
  .s1dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 16px #f59e0b; opacity: 0; }

  /* Screenshot scenes */
  .shot { position: absolute; inset: 0; }
  .shotimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.75) 100%); }

  .tagpill { position: absolute; left: 60px; bottom: 70px; padding: 14px 22px; background: rgba(0,0,0,0.6); border-left: 3px solid #f59e0b; }
  .tagpill .k { font-size: 15px; letter-spacing: 3px; color: #6b7280; text-transform: uppercase; }
  .tagpill .v { font-size: 30px; font-weight: 700; color: #fff; margin-top: 4px; }

  #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 20; opacity: 0; }
  #cursor svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); }
  #clickring { position: absolute; left: 0; top: 0; width: 60px; height: 60px; border: 3px solid #f59e0b; border-radius: 50%; z-index: 19; opacity: 0; }

  /* Scene 4 — stats */
  #s4 { background: #000; display: flex; align-items: center; justify-content: center; gap: 46px; }
  .stat { width: 460px; padding: 46px 40px; background: #0a0a0a; border: 1px solid rgba(245,158,11,0.28); text-align: center; opacity: 0; }
  .stat .num { font-size: 108px; font-weight: 800; color: #f59e0b; line-height: 1; }
  .stat .lbl { margin-top: 18px; font-size: 22px; letter-spacing: 4px; color: #9ca3af; text-transform: uppercase; }
  #s4title { position: absolute; top: 150px; left: 0; right: 0; text-align: center; font-size: 22px; letter-spacing: 10px; color: #6b7280; text-transform: uppercase; opacity: 0; }

  /* Scene 5 — outro */
  #s5 { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #flex { font-size: 74px; font-weight: 800; color: #fff; opacity: 0; text-align: center; }
  #flex .amber { color: #f59e0b; }
  #flexsub { margin-top: 26px; font-size: 26px; letter-spacing: 3px; color: #6b7280; opacity: 0; }
  #outro { position: absolute; opacity: 0; text-align: center; }
  #outroline { font-size: 58px; font-weight: 800; color: #fff; letter-spacing: 2px; }
  #outrocursor { display: inline-block; width: 8px; height: 50px; background: #f59e0b; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080">

  <!-- SCENE 1 — BOOT -->
  <div class="scene" id="s1">
    <img id="s1map" class="fill" src="assets/img/dashboard.png" alt="" />
    <div id="s1vignette"></div>
    <div class="s1dot" id="s1dot1" style="left: 44%; top: 52%;"></div>
    <div class="s1dot" id="s1dot2" style="left: 52%; top: 46%;"></div>
    <div class="s1dot" id="s1dot3" style="left: 48%; top: 58%;"></div>
    <div class="s1dot" id="s1dot4" style="left: 57%; top: 55%;"></div>
    <div class="s1dot" id="s1dot5" style="left: 40%; top: 48%;"></div>
    <div id="boot">
      <div id="brand"><span id="brandtext"></span><span id="brandcursor"></span></div>
      <div id="liveword">LIVE</div>
    </div>
  </div>

  <!-- SCENE 2 — THE BOARD -->
  <div class="scene shot" id="s2">
    <img class="shotimg" id="s2img" src="assets/img/dashboard.png" alt="Tanker Tracker dashboard" />
    <div class="scrim"></div>
    <div class="tagpill" id="s2pill">
      <div class="k">All vessels · Middle East</div>
      <div class="v">Near real-time AIS</div>
    </div>
  </div>

  <!-- SCENE 3 — LOCK-ON -->
  <div class="scene shot" id="s3">
    <img class="shotimg" id="s3img" src="assets/img/dossier.png" alt="Vessel intelligence dossier" />
    <div class="scrim"></div>
    <div id="clickring"></div>
    <div id="cursor">
      <svg width="26" height="26" viewBox="0 0 26 26"><path d="M2 2 L2 20 L7 15 L11 24 L14 22 L10 14 L18 14 Z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>
    </div>
    <div class="tagpill" id="s3pill" style="bottom: auto; top: 70px;">
      <div class="k">Dark-fleet risk dossier</div>
      <div class="v">Identity · sanctions · risk score</div>
    </div>
  </div>

  <!-- SCENE 4 — STATS -->
  <div class="scene" id="s4">
    <div id="s4title">Live intelligence picture</div>
    <div class="stat" id="stat1"><div class="num" id="num1" data-target="140">0</div><div class="lbl">Vessels Tracked</div></div>
    <div class="stat" id="stat2"><div class="num" id="num2" data-target="16">0</div><div class="lbl">Sanctioned</div></div>
    <div class="stat" id="stat3"><div class="num" id="num3" data-target="24">0</div><div class="lbl">Active Anomalies</div></div>
  </div>

  <!-- SCENE 5 — FLEX + OUTRO -->
  <div class="scene" id="s5">
    <div id="flex"><span class="amber">Zero</span> paid API keys.</div>
    <div id="flexsub">live AIS · FRED prices · OpenSanctions · keyless map</div>
    <div id="outro">
      <div id="outroline">TANKER TRACKER<span id="outrocursor"></span></div>
      <div style="font-size:28px; letter-spacing:6px; color:#6b7280; margin-top:20px;">THE OIL WAR, IN REAL TIME</div>
    </div>
  </div>

  <!-- AUDIO -->
  <audio id="music" src="assets/music/track.mp3" data-start="0" data-duration="20" data-volume="0.32" data-media-start="0"></audio>
  <audio id="sfx-blip1" src="assets/sfx/blip.ogg" data-start="1.05" data-duration="0.5" data-volume="0.5"></audio>
  <audio id="sfx-blip2" src="assets/sfx/blip.ogg" data-start="1.59" data-duration="0.5" data-volume="0.5"></audio>
  <audio id="sfx-blip3" src="assets/sfx/blip.ogg" data-start="2.12" data-duration="0.5" data-volume="0.5"></audio>
  <audio id="sfx-blip4" src="assets/sfx/blip.ogg" data-start="2.65" data-duration="0.5" data-volume="0.5"></audio>
  <audio id="sfx-click" src="assets/sfx/click.ogg" data-start="9.5" data-duration="0.6" data-volume="0.7"></audio>
  <audio id="sfx-lock" src="assets/sfx/lock.ogg" data-start="10.54" data-duration="0.9" data-volume="0.8"></audio>
  <audio id="sfx-tick1" src="assets/sfx/tick.ogg" data-start="12.65" data-duration="0.5" data-volume="0.6"></audio>
  <audio id="sfx-tick2" src="assets/sfx/tick.ogg" data-start="13.70" data-duration="0.5" data-volume="0.6"></audio>
  <audio id="sfx-tick3" src="assets/sfx/tick.ogg" data-start="14.76" data-duration="0.5" data-volume="0.6"></audio>
  <audio id="sfx-blip-end" src="assets/sfx/blip.ogg" data-start="18.4" data-duration="0.6" data-volume="0.45"></audio>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    const BRAND = 'TANKER TRACKER';

    // ---- Scene 1: boot (0 - 5.4s) ----
    tl.set('#s1', { opacity: 1 }, 0);
    const brandEl = () => document.getElementById('brandtext');
    for (let i = 1; i <= BRAND.length; i++) {
      tl.call(() => { brandEl().textContent = BRAND.slice(0, i); }, null, 0.15 + i * 0.06);
    }
    tl.to('#s1map', { opacity: 0.45, duration: 1.2 }, 0.6);
    // dots ignite on the beat grid  // beat-grid: 1.07, 1.59, 2.12, 2.65, 3.18
    const dotIds = ['#s1dot1', '#s1dot2', '#s1dot3', '#s1dot4', '#s1dot5'];
    const dotBeats = [1.07, 1.59, 2.12, 2.65, 3.18];
    dotIds.forEach((d, i) => {
      tl.to(d, { opacity: 1, scale: 1.4, duration: 0.28, ease: 'back.out(2)' }, dotBeats[i]);
      tl.to(d, { scale: 1, duration: 0.3 }, dotBeats[i] + 0.28);
    });
    tl.to('#brandcursor', { opacity: 0, duration: 0.001, repeat: 5, yoyo: true, repeatDelay: 0.28 }, 1.0);
    // LIVE lands on strong cue  // beat-locked: 4.23s  (scale instead of letterSpacing to stay transform-only)
    tl.fromTo('#liveword', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' }, 4.23);
    tl.to('#s1', { opacity: 0, duration: 0.5 }, 5.4);

    // ---- Scene 2: the board (5.0 - 9.2s) ----
    tl.fromTo('#s2', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 5.0);
    tl.fromTo('#s2img', { scale: 1.08 }, { scale: 1.0, duration: 4.2, ease: 'none' }, 5.0);
    tl.fromTo('#s2pill', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 6.34); // beat-locked: 6.34s
    tl.to('#s2', { opacity: 0, duration: 0.5 }, 9.0);

    // ---- Scene 3: lock-on (8.9 - 15.0s) ----
    tl.fromTo('#s3', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 8.9);
    tl.fromTo('#s3img', { scale: 1.06 }, { scale: 1.0, duration: 3.6, ease: 'none' }, 8.9);
    // cursor uses transforms (x/y). Start near center, move to Hormuz cluster.
    tl.set('#cursor', { x: 720, y: 640, opacity: 0 }, 8.9);
    tl.to('#cursor', { opacity: 1, duration: 0.3 }, 9.0);
    tl.to('#cursor', { x: 612, y: 442, duration: 0.9, ease: 'power2.inOut' }, 9.1);
    tl.set('#clickring', { x: 585, y: 415, opacity: 0, scale: 0.3 }, 10.0);
    tl.to('#clickring', { opacity: 0.9, scale: 1, duration: 0.25, ease: 'power2.out' }, 10.0);
    tl.to('#clickring', { opacity: 0, scale: 1.5, duration: 0.45 }, 10.25);
    // dossier "acquire" punch on the strong cue  // beat-locked: 10.54s
    tl.fromTo('#s3', { scale: 1.0 }, { scale: 1.015, duration: 0.18, yoyo: true, repeat: 1, ease: 'power2.out' }, 10.54);
    tl.fromTo('#s3pill', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5 }, 10.7);
    tl.to('#cursor', { opacity: 0, duration: 0.3 }, 11.2);
    tl.to('#s3', { opacity: 0, duration: 0.5 }, 14.6);

    // ---- Scene 4: stats (12.5 - 16.9s) ----  // beat-grid: 12.65, 13.70, 14.76
    tl.fromTo('#s4', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 12.5);
    tl.fromTo('#s4title', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4 }, 12.55);
    const statIds = ['#stat1', '#stat2', '#stat3'];
    const numIds = ['#num1', '#num2', '#num3'];
    const statBeats = [12.65, 13.70, 14.76];
    statIds.forEach((s, i) => {
      const t = statBeats[i];
      tl.fromTo(s, { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.6)' }, t);
      const numEl = document.querySelector(numIds[i] );
      const target = parseInt(numEl.getAttribute('data-target'), 10);
      const counter = { v: 0 };
      tl.to(counter, { v: target, duration: 0.9, ease: 'power1.out',
        onUpdate: () => { numEl.textContent = Math.round(counter.v); } }, t);
    });
    tl.to('#s4', { opacity: 0, duration: 0.5 }, 16.6);

    // ---- Scene 5: flex + outro (16.5 - 20s) ----
    tl.fromTo('#s5', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 16.5);
    tl.fromTo('#flex', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 16.7);
    tl.fromTo('#flexsub', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 17.2);
    tl.to('#flex', { opacity: 0, y: -20, duration: 0.4 }, 18.2);
    tl.to('#flexsub', { opacity: 0, duration: 0.4 }, 18.2);
    tl.fromTo('#outro', { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'power2.out' }, 18.5);
    tl.to('#outrocursor', { opacity: 0, duration: 0.001, repeat: 3, yoyo: true, repeatDelay: 0.3 }, 18.9);
    tl.to('#music', { volume: 0, duration: 1.2 }, 18.6);

    window.__timelines = window.__timelines || {};
    window.__timelines['root'] = tl;
  </script>
</div>
</body>
</html>
